                        autoHighlight: true,
                        colorRange: [
                            [254, 229, 217],
                            [252, 174, 145],
                            [251, 106, 74],
                            [222, 45, 38],
                            [165, 15, 21]
                        ],
                        material: {
                            ambient: 0.64,
                            diffuse: 0.6,
                            shininess: 32
                        }
                    }),
                    new deck.PathLayer({
                        id: 'hull-layer',
                        data: [{ path: hullCoords }],
                        getPath: d => d.path,
                        getColor: [255, 255, 255, 200],
                        getWidth: 100,
                        widthMinPixels: 2,
                        widthMaxPixels: 4,
                        capRounded: true,
                        jointRounded: true
                    })
                ],
                getTooltip: ({object}) => object && object.points && {
                    html: `<div style="padding:6px;font-family:Arial;font-size:12px;">
                        <b>${object.points.length} alerts</b>
                    </div>`,
                    style: {
                        backgroundColor: 'rgba(20,20,30,0.9)',
                        color: 'white',
                        borderRadius: '4px'
                    }
                }
            });

            map.addControl(deckOverlay);
            map.addControl(new maplibregl.NavigationControl(), 'bottom-left');
        });
    </script>
</body>
</html>
